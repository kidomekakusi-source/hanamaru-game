const $ = id => document.getElementById(id);
const today = new Date().toLocaleDateString("ja-JP");

$("today").textContent = today;

let lastMaru = localStorage.getItem("lastMaru") || "";
let history = JSON.parse(localStorage.getItem("chatHistory") || "[]");

$("playerName").value = player;
$("maruCount").textContent = "これまでのはなまる：" + count + "個";

function escapeHTML(text) {
  return String(text).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function updateHistory() {
  $("history").innerHTML = history.length
    ? history.slice(-12).map(escapeHTML).join("<br>")
    : "まだおしゃべりしてないよ。";

  localStorage.setItem("chatHistory", JSON.stringify(history));
}

updateHistory();

if (localStorage.getItem("diaryDate") === today) {
  $("diary").value = localStorage.getItem("diary") || "";
}

function talk(text) {
  $("speech").textContent = text;
}

function addLog(text) {
  history.push(text);
  updateHistory();
}

function saveName() {
  player = $("playerName").value.trim();

  if (!player) {
    alert("名前を入力してね！");
    return;
  }

  localStorage.setItem("playerName", player);
  talk("やった〜！これから「" + player + "」って呼ぶな！よろしくやで〜！🌷");
}

function giveMaru() {
  if (lastMaru === today) {
    talk("今日のはなまるはもう押してくれたで〜！今日も生きててえらいっ！💮");
    return;
  }

  count++;
  lastMaru = today;

  localStorage.setItem("maruCount", count);
  localStorage.setItem("lastMaru", today);

  $("maruCount").textContent = "これまでのはなまる：" + count + "個";

  talk("今日のはなまる、受け取ったで〜！💮 " +
    (player ? player + "、" : "") +
    "今日も生きててえらい！大優勝や！");
}

function saveDiary() {
  localStorage.setItem("diary", $("diary").value);
  localStorage.setItem("diaryDate", today);
  $("diaryStatus").textContent = "保存したよ！またいつでも書きに来てな〜🌷";
}

/* --------------------------------
   会話画面の操作
-------------------------------- */

function addButton(label, action) {
  const button = document.createElement("button");
  button.className = "secondary";
  button.textContent = label;
  button.onclick = action;
  $("chatOptions").appendChild(button);
}

function showTopics() {
  $("chatOptions").innerHTML = "";

  topics.forEach(topic => {
    addButton(topic.label, () => {
      addLog("あなた：" + topic.label);
      showNode(topic.node);
    });
  });
}

function showNode(id) {
  if (id === "topics") {
    talk("次は何のお話しよっか〜？好きなものを選んでな！🌷");
    showTopics();
    return;
  }

  const node = conversations[id];

  if (!node) {
    talk("あれれ？ちょっと迷子になっちゃったみたいや……！別のお話しよか！");
    showTopics();
    return;
  }

  const reply = node.replies[
    Math.floor(Math.random() * node.replies.length)
  ];

  const who = player ? player + "、" : "";

  talk(who + reply);
  addLog("まる。" + "：" + reply);

  $("chatOptions").innerHTML = "";

  node.options.forEach(option => {
    addButton(option.label, () => {
      addLog("あなた：" + option.label);
      showNode(option.next);
    });
  });

  addButton("🌷 別の話題を選ぶ", () => {
    talk("ほな、次は何のお話しよっか〜？🌷");
    showTopics();
  });
}

/* 最初の画面 */
if (player) {
  talk("おかえり〜！" + player + "！今日も会えて嬉しいで〜！🌷");
}

showTopics();
